<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style> 
      button {
        --pico-line-height: 0.5;
      }
      th {
        cursor: pointer;
        user-select: none;
      }
      th:hover {
        background-color: rgba(0, 0, 0, 0.03);
      }
      dialog {
        width: 100%;
        max-width: 800px; /* Hacemos el modal un poco más ancho para que entren bien las columnas */
      }
    </style>
</head>
<body>
  <main class="container">
    <h1>Gestor de productos</h1>

    <!-- Buscador en tiempo real -->
    <input type="search" id="buscador" placeholder="Buscar productos por nombre...">

    <!-- Formulario para agregar productos por POST (sin recargar) -->
    <form id="form-productos">
      <fieldset role="group">
        <input type="text" id="nombre" name="nombre" placeholder="Nombre" required>
        <input type="number" id="precio" name="precio" placeholder="Precio" step="0.01" min="0" required>
        <input type="number" id="stock" name="stock" placeholder="Stock" min="0" required>
        <button type="submit">Agregar</button>
      </fieldset>
    </form>

    <!-- Tabla principal de inventario -->
    <table>
      <thead>
        <tr>
          <th onclick="ordenarPor('Nombre')">Nombre</th>
          <th onclick="ordenarPor('Precio')">Precio</th>
          <th onclick="ordenarPor('Stock')">Stock</th>
          <th>Subtotal</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tabla-productos">
        <!-- Los datos se inyectarán aquí con JavaScript -->
      </tbody>
    </table>
    <p id="total-productos">Total: 0 productos</p>

    <!-- Botón para abrir el modal -->
    <button onclick="document.getElementById('modalConInput').showModal()">Registrar Venta</button>
  </main>

  <!-- Ventana Modal de Ventas -->
  <dialog id="modalConInput">
    <form method="dialog">
      <h3>Seleccionar productos para la venta</h3>
      <table>
        <thead>
          <tr>
            <th onclick="ventaordenarPor('Nombre')">Nombre</th>
            <th onclick="ventaordenarPor('Precio')">Precio</th>
            <th onclick="ventaordenarPor('Stock')">Stock</th>
            <th>Cantidad</th> <!-- Añadido para que coincida con el JavaScript -->
            <th>Subtotal</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-productosventa">
          <!-- Los datos se inyectarán aquí con JavaScript -->
        </tbody>
      </table>
      <div style="display: flex; justify-content: flex-end; margin-top: 1rem;">
        <button value="cancel" class="secondary outline">Cerrar</button>
      </div>
    </form>
  </dialog>

  <!-- Tu archivo de JavaScript -->
  <script src="js/app.js"></script>
</body>
</html>
